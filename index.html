<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<title>WebOS-v4.6.3 — Pages, Folders & Swipe</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desktop" id="desktop">
  <div class="desktop-pager" id="desktopPager">
    <div class="desktop-pages" id="desktopPages"></div>
  </div>
  <div class="page-dots hidden" id="pageDots"></div>
  <div id="widgets"></div>
  <div id="windowsLayer"></div>
  <div class="start-menu" id="startMenu">
    <div class="start-header">
      <h3>Web OS</h3>
      <p>Desktop environment in the browser — WebOS-v4.6.3</p>
    </div>
    <input type="text" class="start-search" id="startSearch" placeholder="Search apps, files, notes & settings (Ctrl+K)" autocomplete="off">
    <div class="start-body">
      <div>
        <div class="section-label">Pinned & apps</div>
        <div class="start-grid" id="startApps"></div>
      </div>
      <div id="startFilesWrap" hidden>
        <div class="section-label">Files</div>
        <div class="file-hits" id="startFiles"></div>
      </div>
      <div id="startNotesWrap" hidden>
        <div class="section-label">Notes</div>
        <div class="file-hits" id="startNotes"></div>
      </div>
      <div id="startSettingsWrap" hidden>
        <div class="section-label">Settings</div>
        <div class="file-hits" id="startSettingsHits"></div>
      </div>
    </div>
    <div class="start-footer">
      <button class="btn ghost tiny" id="lockBtn">🔒 Lock</button>
      <button class="btn ghost tiny" id="restartBtn">🔄 Restart</button>
      <button class="btn ghost tiny" id="shutdownBtn">⏻ Shut down</button>
      <div class="start-foot-spacer"></div>
      <span style="font-size:11px;color:var(--muted)">WebOS-v4.6.3</span>
    </div>
  </div>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-head">
      <strong>Notifications</strong>
      <button class="btn ghost tiny" id="notifClearBtn">Clear all</button>
    </div>
    <div class="notif-list" id="notifList"></div>
  </div>
  <div class="cal-panel" id="calPanel"></div>
  <div class="context-menu" id="contextMenu"></div>
  <div class="notifications" id="notifications"></div>
  <div class="taskbar">
    <div class="taskbar-left">
      <button class="tb-btn" id="startBtn" title="Start (Ctrl+K)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 22V12M3 7l9 5 9-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <input type="text" class="tb-input" id="searchInput" placeholder="Search apps, files, settings…">
      <div class="task-apps" id="taskApps"></div>
    </div>
    <div class="taskbar-right">
      <button class="tb-btn" id="notifBell" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="notifBadge" hidden></span>
      </button>
      <button class="tb-tray" id="netTray"><span id="netIcon">📶</span> <span id="netLabel">Online</span></button>
      <button class="tb-tray" id="batTray" hidden><span id="batIcon">🔋</span> <span id="batLabel">—</span></button>
      <span id="clockDate"></span>
      <button class="tb-tray" id="clockBtn" title="Calendar"><span id="clock">--:--</span></button>
    </div>
  </div>
  <div class="boot-screen" id="bootScreen">
    <div class="boot-logo">⬢</div>
    <div class="boot-title">Web OS <span class="boot-version">4.6.3</span></div>
    <div class="boot-bar"><div class="boot-fill"></div></div>
    <div class="boot-status">Powering up dynamic desktop…</div>
    <div class="boot-hint">click to skip</div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
