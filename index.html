<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web OS 2.0 — Desktop Environment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desktop" id="desktop">

    <!-- Desktop icons (rendered from the app registry by script.js) -->
    <div class="desktop-icons" id="desktopIcons"></div>

    <!-- Open application windows (managed by the window manager) -->
    <div id="windowsLayer"></div>

    <!-- Start Menu (launcher grid + search) -->
    <div class="start-menu" id="startMenu">
      <div class="start-header">
        <h3>Web OS</h3>
        <p>Desktop environment in the browser — v2.0</p>
      </div>
      <input type="text" id="startSearch" class="start-search"
             placeholder="Search apps and files…  (Ctrl+K)" autocomplete="off" />
      <div class="start-section-label">Apps</div>
      <div class="start-grid" id="startApps"></div>
      <div class="start-section-label" id="startFilesLabel" hidden>Files</div>
      <div class="start-files" id="startFiles"></div>
    </div>

    <!-- Notification Center panel -->
    <div class="notif-panel" id="notifPanel">
      <div class="notif-panel-head">
        <strong>Notifications</strong>
        <button class="os-btn ghost notif-clear">Clear all</button>
      </div>
      <div class="notif-list" id="notifList"></div>
    </div>

    <!-- Calendar panel (clock popup) -->
    <div class="calendar-panel" id="calendarPanel"></div>

    <!-- Desktop right-click context menu -->
    <div class="context-menu" id="contextMenu"></div>

    <!-- Notification toasts -->
    <div class="notifications" id="notifications"></div>

    <!-- Taskbar -->
    <div class="taskbar">
      <div class="taskbar-left">
        <button class="start-btn" id="startBtn" title="Start (Ctrl+K)">⬢</button>
        <div class="task-apps" id="taskApps"></div>
      </div>
      <div class="taskbar-right">
        <button class="tray-btn" id="notifBell" title="Notifications">🔔<span class="badge" id="notifBadge" hidden></span></button>
        <span id="clockDate"></span>
        <button class="tray-btn clock-btn" id="clockBtn" title="Calendar"><span id="clock">--:--</span></button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
